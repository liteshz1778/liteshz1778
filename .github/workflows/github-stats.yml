name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:       # run manually once from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: Pranesh-2005/github-readme-stats-fast-action@v1.3
        with:
          card: stats
          options: "username=liteshz1778&show_icons=true&theme=github_dark&hide_border=true"
          path: assets/stats/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        uses: Pranesh-2005/github-readme-stats-fast-action@v1.3
        with:
          card: streak
          options: "username=liteshz1778&theme=github-dark-blue&hide_border=true"
          path: assets/stats/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: Pranesh-2005/github-readme-stats-fast-action@v1.3
        with:
          card: top-langs
          options: "username=liteshz1778&size_weight=1&count_weight=1&langs_count=40&theme=github_dark&layout=donut-vertical&hide_border=true"
          path: assets/stats/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg
          git commit -m "chore: update GitHub stats cards" || echo "No changes to commit"
          git push origin HEAD
