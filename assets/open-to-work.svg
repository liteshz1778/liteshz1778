<svg xmlns="http://www.w3.org/2000/svg" width="470" height="46" viewBox="0 0 470 46" role="img" aria-label="Open to QA automation roles in Pune and Remote">
<style>
.p{animation:pl 1.8s ease-out infinite;transform-origin:26px 23px}
.d{animation:bl 1.8s ease-in-out infinite}
@keyframes pl{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
@keyframes bl{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.p,.d{animation:none}}
</style>
<rect x="1" y="1" width="468" height="44" rx="22" fill="#dff3e9" stroke="#1b7f55" stroke-width="1.5"/>
<circle class="p" cx="26" cy="23" r="6" fill="#1b7f55"/>
<circle class="d" cx="26" cy="23" r="6" fill="#1b7f55"/>
<text x="46" y="29" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#14532d">Open to QA automation roles in Pune &amp; Remote</text>
</svg>