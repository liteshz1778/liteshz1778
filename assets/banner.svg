<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="QA AUTOMATION ENGINEER, Litesh Zadane" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#14213d"/><stop offset="1" stop-color="#1b2f6b"/></linearGradient>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5b7cff" stroke-opacity=".16"/></pattern>
<linearGradient id="sc" x1="0" x2="1"><stop offset="0" stop-color="#5fd39c" stop-opacity="0"/><stop offset="1" stop-color="#5fd39c" stop-opacity=".45"/></linearGradient>
</defs>
<style>
.wm{font:900 84px Impact,'Arial Black','Segoe UI',sans-serif;fill:#5b7cff;fill-opacity:0;stroke:#7d95ff;stroke-width:1.4;stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease-out forwards,fp 5s 4s ease-in-out infinite}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fp{0%,100%{fill-opacity:.05}50%{fill-opacity:.22}}
.grid{animation:gm 6s linear infinite}
@keyframes gm{to{transform:translateX(40px)}}
.scan{animation:sm 6s linear infinite}
@keyframes sm{from{transform:translateX(-140px)}to{transform:translateX(1020px)}}
.ic{fill:none;stroke:#8fa6ff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.55;animation:fl 6s ease-in-out infinite}
.ic.b{animation-duration:8s;animation-delay:-2s}
.ic.c{animation-duration:10s;animation-delay:-5s}
@keyframes fl{50%{transform:translateY(-9px)}}
.nm{font:800 58px 'Segoe UI',Arial,sans-serif;fill:#fff;stroke:#0b1220;stroke-width:6;paint-order:stroke;letter-spacing:4px;animation:up .9s .3s ease-out backwards}
.sb{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#c9d4ff;letter-spacing:3px;animation:up .9s .7s ease-out backwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.ok{font:500 14px ui-monospace,Menlo,Consolas,monospace;fill:#5fd39c;animation:bk 2.4s ease-in-out infinite}
@keyframes bk{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.wm{animation:none;stroke-dashoffset:0;fill-opacity:.12}.grid,.scan,.ic,.nm,.sb,.ok{animation:none}}
</style>
<rect width="1000" height="280" fill="url(#bg)"/>
<rect class="grid" x="-40" y="0" width="1080" height="280" fill="url(#g)"/>
<text class="wm" x="500" y="160" text-anchor="middle" textLength="960" lengthAdjust="spacingAndGlyphs">QA AUTOMATION ENGINEER</text>
<rect class="scan" y="0" width="120" height="280" fill="url(#sc)"/>
<g transform="translate(80 62)"><g class="ic"><circle r="22"/><path d="M-9 0l6 7 12-14"/></g></g>
<g transform="translate(920 58)"><g class="ic b"><path d="M-14-14l-16 14 16 14M14-14l16 14-16 14M4-20l-8 40"/></g></g>
<g transform="translate(905 218)"><g class="ic c"><ellipse cy="4" rx="13" ry="17"/><path d="M-13 0h-12M13 0h12M-12 12l-12 8M12 12l12 8M-8-12l-6-9M8-12l6-9M0-13v34"/></g></g>
<g transform="translate(95 218)"><g class="ic b"><rect x="-26" y="-20" width="52" height="40" rx="6"/><path d="M-14-6l8 6-8 6M0 8h14"/></g></g>
<text class="nm" x="500" y="128" text-anchor="middle">LITESH ZADANE</text>
<text class="sb" x="500" y="180" text-anchor="middle">UI &amp; API TEST AUTOMATION  |  PAYMENTS &amp; FINANCIAL SERVICES</text>
<text class="ok" x="975" y="264" text-anchor="end">5 passed, 0 failed</text>
</svg>
